name: CI pipeline

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
  

    steps:
      - uses: actions/checkout@v5
   
      - uses: actions/setup-python@v4
        with:
           python-version: '3.11'
      - run: pip install pytest
      - run: pytest 
      - run: docker --version
      - run: echo "this is my second workflow"
    
      - run: cat test.txt
      
      
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - run: docker --version
      - run: echo "build is running"
      